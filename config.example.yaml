# DDoS Shield example configuration.
# Copy to config.yaml and adjust to your traffic patterns, then:
#   protect(app, **load_config("config.yaml"))

rate_limiter:
  max_requests: 60      # max requests allowed per client...
  window_seconds: 60    # ...within this rolling window

blocklist:
  ban_seconds: 300      # how long a tripped client stays banned
  use_iptables: false   # true = also drop the IP at the firewall (Linux, root)

monitor:
  spike_threshold: 500  # requests/sec across all clients that counts as a spike
  sample_seconds: 5     # window used to compute the current rate
  alert_cooldown: 60    # min seconds between on_attack alerts

maintenance:
  cleanup_interval: 60  # how often stale per-client state is dropped

# Stricter limits for sensitive routes (covers sub-paths too).
path_limits:
  /login:
    max_requests: 5     # login attempts...
    window_seconds: 60  # ...per minute per client

# Log and count would-be rejections without rejecting anything.
mode:
  dry_run: false

# Never rate-limited: health checks, internal networks, your load balancer.
allowlist:
  - 127.0.0.1
  - 10.0.0.0/8
